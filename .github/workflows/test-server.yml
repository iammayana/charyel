name: Backend Tests (Laravel)

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'

jobs:
  laravel-tests:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:9.7.2
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: charyel_test
          MYSQL_USER: charyel_test
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, curl, zip
          coverage: none

      - name: Copy .env
        working-directory: server
        run: cp .env.example .env

      - name: Install Dependencies
        working-directory: server
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        working-directory: server
        run: php artisan key:generate

      - name: Set Directory Permissions
        working-directory: server
        run: chmod -R 777 storage bootstrap/cache

      - name: Execute Tests
        working-directory: server
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: charyel_test
          DB_USERNAME: charyel_test
          DB_PASSWORD: test_password
        run: php artisan test
